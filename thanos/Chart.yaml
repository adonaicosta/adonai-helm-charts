  - common
  version: 2.x.x
description: Thanos is a highly available metrics system that can be added on top
  of existing Prometheus deployments, providing a global query view across all Prometheus
  installations.
home: https://thanos.io
icon: https://thanos.io/img/thanos-stack-220x234.png
keywords:
- analytics
- monitoring
- prometheus
- thanos
maintainers:
- name: bozo
  url: https://github.com/thanos.io
name: thanos
sources:
- https://github.com/thanos.io
version: 14.0.2
