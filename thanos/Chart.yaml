annotations:
  category: Analytics
  images: |
    - name: os-shell
      image: ghcr.io/adonaicosta/os-shell:12-debian-12-r26
    - name: thanos
      image: quay.io/thanos/thanos:v0.34.1
  licenses: Apache-2.0
apiVersion: v2
appVersion: 0.34.1
dependencies:
- condition: minio.enabled
  name: minio
  repository: oci://registry-1.docker.io/
  version: 13.x.x
- name: common
  repository: https://adonaicosta.github.io/adonai-helm-charts
