templates:
- |-
  apiVersion: v1
  kind: ConfigMap
  metadata:
    labels:
      app: example
    name: config
    namespace: default
  data:
    config:
      ENVIRONMENT: {{ .Values.environment | default "DEVELOPMENT" }}
      USERNAME: admin
- |-
  apiVersion: kiali.io/v1alpha1
  kind: Kiali
  metadata:
    name: kiali
    namespace: istio-system
  spec:
    auth:
      strategy: anonymous

