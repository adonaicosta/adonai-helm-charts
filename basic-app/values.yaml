## Service ##
#############

service:
  enabled: true
  type: ClusterIP
  port: 80
  name: http

###################
## Configuration ##
###################

configMap:
  enabled: false
  mountPath: ""
  data: {}

secret:
  enabled: false
  mountPath: ""
  data: {}

# this section is to mount an existing secret in the Deployment as a volume.
existingSecrets: []
#-  mountPath: ""
#   secretName: ""
#   subPath: ""
#-  mountPath: ""
#   secretName: ""
#   subPath: ""


#############
## Storage ##
#############

storage:
  enabled: false
  storageClassName: default
  size: 10Gi
  mountPath: /data
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce

  #pv:
  #  name: mypv
  #  annotations: {}
  #  labels: {}
  #  spec: {}

