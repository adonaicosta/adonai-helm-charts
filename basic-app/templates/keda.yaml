{{- if and .Values.autoscaling.enabled (eq (default "hpa" .Values.autoscaling.type) "keda") -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "basic-deployment.name" . }}
  labels:
    {{- include "basic-deployment.labels" . | nindent 4 }}
  {{- with .Values.autoscaling.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "basic-deployment.name" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  {{- with .Values.autoscaling.pollingInterval }}
  pollingInterval: {{ . }}
  {{- end }}
  {{- with .Values.autoscaling.cooldownPeriod }}
  cooldownPeriod: {{ . }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.autoscaling.idleReplicaCount) }}
  idleReplicaCount: {{ .Values.autoscaling.idleReplicaCount }}
  {{- end }}
  {{- with .Values.autoscaling.fallback }}
  fallback:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.autoscaling.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- toYaml (.Values.autoscaling.triggers | required "autoscaling.triggers is required when autoscaling.type is keda") | nindent 4 }}
{{- end }}
